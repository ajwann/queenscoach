[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "queenscoach"
version = "2.1.1"
description = "MCP server for Charlotte Area Transit System (CATS) buses and light rail: trip planning, live arrivals, timetables, and service alerts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  "gtfs-realtime-bindings>=2.2,<3",
  "httpx>=0.28,<1",
  # The http transport: the ASGI app, the server that runs it, and ID token
  # verification. All three also arrive with mcp; declared because we import them.
  "starlette>=0.48,<2",
  "uvicorn>=0.34,<1",
  "pyjwt[crypto]>=2.10,<3",
  # The timetable's clock is in the agency's zone. zoneinfo reads the system's
  # database, which slim containers and Windows may lack; this is its fallback.
  "tzdata>=2025.2",
]

[project.optional-dependencies]
# The Firestore token store (QUEENSCOACH_TOKEN_STORE=firestore), for a hosted HTTP
# server that scales to zero or runs several instances. stdio never needs it.
gcp = ["google-cloud-firestore>=2.20,<3"]
dev = [
  "queenscoach[gcp]",
  "pytest>=8",
  "pytest-asyncio>=1",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-protobuf",
]

[project.scripts]
queenscoach = "queenscoach.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/queenscoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PTH", "TID"]
ignore = ["S101"]  # pytest asserts

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The generated protobuf bindings ship no usable stubs for the transit package.
module = ["google.transit.*"]
ignore_missing_imports = true
