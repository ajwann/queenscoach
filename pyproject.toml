[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "queenscoach"
version = "1.0.0"
description = "MCP server for Charlotte Area Transit System (CATS) realtime bus and light rail data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  "gtfs-realtime-bindings>=2.2,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-protobuf",
]

[project.scripts]
queenscoach = "queenscoach.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/queenscoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PTH", "TID"]
ignore = ["S101"]  # pytest asserts

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The generated protobuf bindings ship no usable stubs for the transit package.
module = ["google.transit.*"]
ignore_missing_imports = true
