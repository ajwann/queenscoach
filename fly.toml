# Fly.io deployment for the QueensCoach HTTP server.
#
# First-time setup:
#   fly launch --no-deploy --copy-config
#   fly secrets set CATS_AUTH_TOKEN=$(openssl rand -hex 32)
#   fly deploy
#
# The connector URL is then https://<app-name>.fly.dev/mcp

app = "queenscoach"
primary_region = "atl"  # Atlanta: closest region to Charlotte.

[build]

[env]
  PORT = "8080"
  CATS_HTTP_HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one instance warm: a cold start would otherwise refetch the ~2.6 MB
  # static GTFS archive before the first tool call could be answered.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
